<script>
const SUPABASE_URL='https://itgdvppxnplgwdaadszm.supabase.co';
const SUPABASE_KEY='sb_publishable_KdONpTmaoYDQxHx93R29cQ_2G6jz3u8';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null, profile=null, page='dashboard', selectedCall=null, detailTab='overview', authMode='signup', cache={ships:[],lines:[],calls:[],tasks:[],contacts:[],medical:[],vendors:[],services:[],transfers:[],hotels:[],documents:[]};
const nav=[['dashboard','⌂','Dashboard'],['portcalls','⚓','Port Calls'],['tasks','✓','Operations'],['people','♟','People'],['medical','✚','Medical'],['transfers','⇄','Transportation'],['hotels','▣','Hotels'],['vendors','◈','Vendors & Services'],['documents','▤','Documents'],['reports','▥','Reports'],['settings','⚙','Settings']];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setNav(){const html=nav.map(([id,ic,label])=>`<button class="nav-btn ${page===id?'active':''}" onclick="go('${id}')">${ic}&nbsp;&nbsp;${label}</button>`).join('');$('sidebar').innerHTML=html;$('mobileNav').innerHTML=nav.slice(0,5).map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span class="mi">${ic}</span>${label}</button>`).join('')}
function routeFromHash(){
 const h=(window.location.hash||'').replace(/^#\/?/,'').replace(/\/$/,'');
 return h || 'dashboard';
}
function syncRoute(){
 const r=routeFromHash();
 const parts=r.split('/');
 page=parts[0]||'dashboard';
 if(page==='users' && profile?.role!=='admin'){page='settings'; history.replaceState(null,'','#/settings'); toast('Admin access required.');}
 if(page==='portcalls' && parts[1]) selectedCall=decodeURIComponent(parts[1]); else selectedCall=null;
 detailTab='overview';
 setNav();
 if(selectedCall && cache.calls.length) renderCallDetail(); else render();
}
function go(p){
 if(p===page && !selectedCall){ setNav(); render(); return; }
 window.location.hash='#/'+p;
}
window.addEventListener('hashchange',syncRoute);
async function db(table,select='*',opts={}){let q=sb.from(table).select(select);if(opts.order)q=q.order(opts.order.col,{ascending:opts.order.asc??false});if(opts.limit)q=q.limit(opts.limit);if(opts.eq)Object.entries(opts.eq).forEach(([k,v])=>q=q.eq(k,v));const {data,error}=await q;if(error)throw error;return data||[]}
async function loadAll(){
 const results=await Promise.all([
  db('cruise_lines','*',{order:{col:'name',asc:true}}),db('ships','*',{order:{col:'name',asc:true}}),db('port_calls','*',{order:{col:'arrival_date',asc:false}}),db('tasks','*',{order:{col:'due_at',asc:true}}),db('contacts','*',{order:{col:'created_at',asc:false}}),db('medical_cases','*',{order:{col:'created_at',asc:false}}),db('vendors','*',{order:{col:'name',asc:true}}),db('service_requests','*',{order:{col:'requested_at',asc:false}}),db('transfers','*',{order:{col:'pickup_at',asc:true}}),db('hotel_bookings','*',{order:{col:'check_in',asc:true}}),db('documents','*',{order:{col:'created_at',asc:false}})
 ]);
 [cache.lines,cache.ships,cache.calls,cache.tasks,cache.contacts,cache.medical,cache.vendors,cache.services,cache.transfers,cache.hotels,cache.documents]=results;
}
function shipName(id){return cache.ships.find(s=>s.id===id)?.name||'Unassigned ship'}
function lineName(id){return cache.lines.find(s=>s.id===id)?.name||'—'}
function callLabel(id){const c=cache.calls.find(x=>x.id===id);return c?`${shipName(c.ship_id)} · ${fmtDate(c.arrival_date)}`:'Unassigned call'}
async function init(){const {data,error}=await sb.auth.getSession();if(error){showAuthMessage(error.message,true);return}session=data.session;if(session)await enter();else showAuth();sb.auth.onAuthStateChange((_event,s)=>{session=s;setTimeout(()=>{if(s)enter();else{profile=null;showAuth()}},0)})}
async function enter(){try{if(!session){showAuth();return}const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error)throw error;profile=p||{full_name:session.user.email,role:'viewer',active:true};$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userChip').textContent=profile.full_name||session.user.email;if(!['admin','port_manager','port_agent'].includes(profile.role)){toast('Read-only access: an administrator must assign an operational role before you can create or edit records.')}await loadAll();syncRoute()}catch(e){showAuthMessage(e.message,true)}}
function showAuthMessage(msg,isError=false){const el=$('authNotice');el.textContent=msg;el.classList.remove('hidden');el.style.background=isError?'#fee2e2':'#ecfeff';el.style.color=isError?'#991b1b':'#155e75'}
function clearAuthMessage(){$('authNotice').classList.add('hidden');$('authNotice').textContent='';$('authStatus').classList.add('hidden')}
function showAuth(){ $('app').classList.add('hidden');$('auth').classList.remove('hidden');$('nameField').classList.toggle('hidden',authMode==='signin');$('authSubmit').textContent=authMode==='signin'?'Sign in':'Create account';$('toggleAuth').textContent=authMode==='signin'?"I need an account":"I already have an account";$('forgotPassword').classList.toggle('hidden',authMode!=='signin');clearAuthMessage(); }
$('toggleAuth').onclick=()=>{authMode=authMode==='signin'?'signup':'signin';showAuth()};
$('forgotPassword').onclick=async()=>{const email=prompt('Enter your CruiseOps email address:');if(!email)return;const redirectTo=window.location.href.split('#')[0];const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo});if(error)showAuthMessage(error.message,true);else{$('authStatus').textContent='Password reset email sent. Check your inbox.';$('authStatus').classList.remove('hidden')}};
$('authForm').onsubmit=async e=>{e.preventDefault();clearAuthMessage();const email=$('authEmail').value.trim().toLowerCase(),password=$('authPassword').value,name=$('authName').value.trim();$('authSubmit').disabled=true;try{if(authMode==='signup'){const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:window.location.href.split('#')[0]}});if(error)throw error;if(data.user&&!data.session){$('authStatus').textContent='Account created. Check your email and confirm your address before signing in.';$('authStatus').classList.remove('hidden')}else if(data.session){toast('Account created.')} }else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}}catch(e){let msg=e?.message||'Authentication failed.';if(/invalid login credentials/i.test(msg))msg='Invalid email or password. If you just registered, confirm your email first.';if(/email not confirmed/i.test(msg))msg='Please confirm your email address before signing in.';showAuthMessage(msg,true)}finally{$('authSubmit').disabled=false}};
$('signOutBtn').onclick=()=>sb.auth.signOut();$('refreshBtn').onclick=async()=>{try{await loadAll();render();toast('Data refreshed')}catch(e){toast(e.message)}};
function render(){setNav();const r={dashboard:renderDashboard,portcalls:renderPortCalls,tasks:renderTasks,people:renderPeople,medical:renderMedical,transfers:renderTransfers,hotels:renderHotels,vendors:renderVendors,documents:renderDocuments,reports:renderReports,settings:renderSettings,users:renderUsers}[page]||renderDashboard;r()}
function head(title,sub,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function renderDashboard(){
 const active=cache.calls.filter(c=>['arriving','in_port'].includes(c.status)).length, upcoming=cache.calls.filter(c=>c.arrival_date>=new Date().toISOString().slice(0,10)&&!['completed','cancelled','departed'].includes(c.status)).length, openTasks=cache.tasks.filter(t=>!['completed','cancelled'].includes(t.status)).length, openMed=cache.medical.filter(m=>!['closed','discharged'].includes(m.status)).length;
 const urgent=cache.tasks.filter(t=>['urgent','high'].includes(t.priority)&&!['completed','cancelled'].includes(t.status)).length;
 $('main').innerHTML=head('Operations Dashboard','Live operational snapshot from your central port-call database.',`<button class="btn primary" onclick="openCallForm()">+ Port Call</button><button class="btn" onclick="quickTask()">+ Task</button><button class="btn" onclick="quickMedical()">+ Medical</button>`)+
 `<div class="grid stats"><div class="card stat"><div class="label">Active calls</div><div class="num">${active}</div><div class="hint">Arriving / in port</div></div><div class="card stat"><div class="label">Upcoming calls</div><div class="num">${upcoming}</div><div class="hint">Scheduled workload</div></div><div class="card stat"><div class="label">Open tasks</div><div class="num">${openTasks}</div><div class="hint">${urgent} high/urgent</div></div><div class="card stat"><div class="label">Medical cases</div><div class="num">${openMed}</div><div class="hint">Open / active</div></div><div class="card stat"><div class="label">Vendors</div><div class="num">${cache.vendors.filter(v=>v.active).length}</div><div class="hint">Active directory</div></div></div>

}

function renderPortCalls(){

async function adminCall(action,payload={}){if(profile?.role!=='admin')throw new Error('Admin access required.');const {data,error}=await sb.functions.invoke('admin-user-management',{body:{action,...payload,redirect_to:window.location.href.split('#')[0]}});if(error)throw error; if(data?.error)throw new Error(data.error);return data}

function callOptions(selected=''){return `<option value="">No linked call</option>`+cache.calls.map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(callLabel(c.id))}</option>`).join('')}
function shipOptions(selected=''){return cache.ships.map(s=>`<option value="${s.id}" ${selected===s.id?'selected':''}>${esc(s.name)} · ${esc(lineName(s.cruise_line_id))}</option>`).join('')}
function openCallForm(id=null){const c=id?cache.calls.find(x=>x.id===id):{};modal(id?'Edit Port Call':'New Port Call',`<form id="callForm"><div class="form-grid"><div class="field"><label>Ship</label><select name="ship_id" required>${shipOptions(c.ship_id)}</select></div><div class="field"><label>Status</label><select name="status">${['scheduled','arriving','in_port','departed','completed','cancelled'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Arrival date</label><input name="arrival_date" type="date" required value="${c.arrival_date||''}"></div><div class="field"><label>Berth</label><input name="berth" value="${esc(c.berth||'')}" placeholder="Heritage Quay"></div><div class="field"><label>ETA</label><input name="eta" type="datetime-local" value="${dtLocal(c.eta)}"></div><div class="field"><label>ETD</label><input name="etd" type="datetime-local" value="${dtLocal(c.etd)}"></div><div class="field"><label>Voyage number</label><input name="voyage_number" value="${esc(c.voyage_number||'')}"></div><div class="field"><label>Master</label><input name="master_name" value="${esc(c.master_name||'')}"></div><div class="field"><label>Passengers expected</label><input name="passengers_expected" type="number" min="0" value="${c.passengers_expected??0}"></div><div class="field"><label>Crew expected</label><input name="crew_expected" type="number" min="0" value="${c.crew_expected??0}"></div><div class="field full"><label>Port clearance status</label><input name="port_clearance_status" value="${esc(c.port_clearance_status||'')}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(c.notes||'')}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${id?'Save changes':'Create call'}</button></div></form>`);$('callForm').onsubmit=e=>saveCall(e,id)}
const dtLocal=v=>v?new Date(v).toISOString().slice(0,16):'';
async function saveCall(e,id){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());o.passengers_expected=+o.passengers_expected;o.crew_expected=+o.crew_expected;o.eta=o.eta?new Date(o.eta).toISOString():null;o.etd=o.etd?new Date(o.etd).toISOString():null;try{let q=id?sb.from('port_calls').update(o).eq('id',id):sb.from('port_calls').insert({...o,created_by:session.user.id});const {error}=await q;if(error)throw error;await loadAll();closeModal();if(id){selectedCall=id;renderCallDetail()}else renderPortCalls();toast('Port call saved')}catch(err){toast(err.message)}}
function quickTask(callId=''){openTaskForm(null,callId||selectedCall)}function editTask(id){openTaskForm(id)}
function openTaskForm(id=null,callId=''){const t=id?cache.tasks.find(x=>x.id===id):{};modal(id?'Edit Task':'New Task',`<form id="taskForm"><div class="form-grid"><div class="field full"><label>Title</label><input name="title" required value="${esc(t.title||'')}"></div><div class="field"><label>Port call</label><select name="port_call_id">${callOptions(t.port_call_id||callId)}</select></div><div class="field"><label>Status</label><select name="status">${['open','in_progress','blocked','completed','cancelled'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select name="priority">${['low','normal','high','urgent'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Due</label><input name="due_at" type="datetime-local" value="${dtLocal(t.due_at)}"></div><div class="field full"><label>Description</label><textarea name="description">${esc(t.description||'')}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save task</button></div></form>`);$('taskForm').onsubmit=e=>saveTask(e,id)}
async function saveTask(e,id){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());o.due_at=o.due_at?new Date(o.due_at).toISOString():null;if(o.status==='completed')o.completed_at=new Date().toISOString();try{const {error}=id?await sb.from('tasks').update(o).eq('id',id):await sb.from('tasks').insert({...o,created_by:session.user.id});if(error)throw error;await loadAll();closeModal();render();toast('Task saved')}catch(err){toast(err.message)}}
function quickMedical(){openMedicalForm(null,selectedCall)}
function openMedicalForm(id=null,callId=''){const m=id?cache.medical.find(x=>x.id===id):{};modal(id?'Edit Medical Case':'New Medical Case',`<form id="medForm"><div class="form-grid"><div class="field"><label>Port call</label><select name="port_call_id">${callOptions(m.port_call_id||callId)}</select></div><div class="field"><label>Contact ID</label><select name="contact_id"><option value="">Not linked</option>${cache.contacts.map(x=>`<option value="${x.id}" ${m.contact_id===x.id?'selected':''}>${esc([x.first_name,x.last_name].filter(Boolean).join(' ')||x.external_id||'Unnamed')}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['open','transporting','at_hospital','discharged','follow_up','closed'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select name="priority">${['low','normal','high','urgent'].map(x=>`<option ${m.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Hospital</label><input name="hospital" value="${esc(m.hospital||'')}"></div><div class="field"><label>Hospital contact</label><input name="hospital_contact" value="${esc(m.hospital_contact||'')}"></div><div class="field"><label>Ambulance required</label><select name="ambulance_required"><option value="false" ${!m.ambulance_required?'selected':''}>No</option><option value="true" ${m.ambulance_required?'selected':''}>Yes</option></select></div><div class="field"><label>Follow-up</label><input name="follow_up_at" type="datetime-local" value="${dtLocal(m.follow_up_at)}"></div><div class="field full"><label>Diagnosis / notes</label><textarea name="diagnosis_notes">${esc(m.diagnosis_notes||'')}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save case</button></div></form>`);$('medForm').onsubmit=e=>saveMedical(e,id)}
async function saveMedical(e,id){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());o.ambulance_required=o.ambulance_required==='true';o.follow_up_at=o.follow_up_at?new Date(o.follow_up_at).toISOString():null;try{const {error}=id?await sb.from('medical_cases').update(o).eq('id',id):await sb.from('medical_cases').insert({...o,created_by:session.user.id});if(error)throw error;await loadAll();closeModal();render();toast('Medical case saved')}catch(err){toast(err.message)}}
function quickTransfer(){openTransferForm(null,selectedCall)}
function openTransferForm(id=null,callId=''){const t=id?cache.transfers.find(x=>x.id===id):{};modal(id?'Edit Transfer':'New Transfer',`<form id="transferForm"><div class="form-grid"><div class="field"><label>Port call</label><select name="port_call_id">${callOptions(t.port_call_id||callId)}</select></div><div class="field"><label>Transfer type</label><input name="transfer_type" required value="${esc(t.transfer_type||'Crew')}"></div><div class="field"><label>Pickup</label><input name="pickup_location" required value="${esc(t.pickup_location||'')}"></div><div class="field"><label>Dropoff</label><input name="dropoff_location" required value="${esc(t.dropoff_location||'')}"></div><div class="field"><label>Pickup time</label><input name="pickup_at" type="datetime-local" value="${dtLocal(t.pickup_at)}"></div><div class="field"><label>Passenger count</label><input name="passenger_count" type="number" min="1" value="${t.passenger_count||1}"></div><div class="field"><label>Vehicle</label><input name="vehicle" value="${esc(t.vehicle||'')}"></div><div class="field"><label>Driver</label><input name="driver_name" value="${esc(t.driver_name||'')}"></div><div class="field"><label>Driver phone</label><input name="driver_phone" value="${esc(t.driver_phone||'')}"></div><div class="field"><label>Status</label><select name="status">${['requested','assigned','en_route','picked_up','completed','cancelled'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(t.notes||'')}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save transfer</button></div></form>`);$('transferForm').onsubmit=e=>saveTransfer(e,id)}
async function saveTransfer(e,id){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());o.passenger_count=+o.passenger_count;o.pickup_at=o.pickup_at?new Date(o.pickup_at).toISOString():null;try{const {error}=id?await sb.from('transfers').update(o).eq('id',id):await sb.from('transfers').insert({...o,created_by:session.user.id});if(error)throw error;await loadAll();closeModal();render();toast('Transfer saved')}catch(err){toast(err.message)}}
function quickHotel(){openHotelForm(null,selectedCall)}
function openHotelForm(id=null,callId=''){const h=id?cache.hotels.find(x=>x.id===id):{};modal(id?'Edit Hotel Booking':'New Hotel Booking',`<form id="hotelForm"><div class="form-grid"><div class="field"><label>Port call</label><select name="port_call_id">${callOptions(h.port_call_id||callId)}</select></div><div class="field"><label>Hotel name</label><input name="hotel_name" required value="${esc(h.hotel_name||'')}"></div><div class="field"><label>Confirmation</label><input name="confirmation_number" value="${esc(h.confirmation_number||'')}"></div><div class="field"><label>Room type</label><input name="room_type" value="${esc(h.room_type||'')}"></div><div class="field"><label>Check in</label><input name="check_in" type="date" required value="${h.check_in||''}"></div><div class="field"><label>Check out</label><input name="check_out" type="date" required value="${h.check_out||''}"></div><div class="field"><label>Rooms</label><input name="room_count" type="number" min="1" value="${h.room_count||1}"></div><div class="field"><label>Rate</label><input name="rate" type="number" step="0.01" value="${h.rate??''}"></div><div class="field"><label>Currency</label><input name="currency" value="${esc(h.currency||'XCD')}"></div><div class="field"><label>Billing status</label><select name="billing_status"><option ${h.billing_status==='pending'?'selected':''}>pending</option><option ${h.billing_status==='confirmed'?'selected':''}>confirmed</option><option ${h.billing_status==='invoiced'?'selected':''}>invoiced</option><option ${h.billing_status==='paid'?'selected':''}>paid</option></select></div><div class="field"><label>Breakfast confirmed</label><select name="breakfast_confirmed"><option value="false" ${!h.breakfast_confirmed?'selected':''}>No</option><option value="true" ${h.breakfast_confirmed?'selected':''}>Yes</option></select></div><div class="field"><label>All-inclusive confirmed</label><select name="all_inclusive_confirmed"><option value="false" ${!h.all_inclusive_confirmed?'selected':''}>No</option><option value="true" ${h.all_inclusive_confirmed?'selected':''}>Yes</option></select></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(h.notes||'')}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save booking</button></div></form>`);$('hotelForm').onsubmit=e=>saveHotel(e,id)}
async function saveHotel(e,id){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());o.room_count=+o.room_count;o.rate=o.rate?+o.rate:null;o.breakfast_confirmed=o.breakfast_confirmed==='true';o.all_inclusive_confirmed=o.all_inclusive_confirmed==='true';try{const {error}=id?await sb.from('hotel_bookings').update(o).eq('id',id):await sb.from('hotel_bookings').insert({...o,created_by:session.user.id});if(error)throw error;await loadAll();closeModal();render();toast('Hotel booking saved')}catch(err){toast(err.message)}}
function openVendorForm(id=null){const v=id?cache.vendors.find(x=>x.id===id):{};modal(id?'Edit Vendor':'New Vendor',`<form id="vendorForm"><div class="form-grid"><div class="field full"><label>Vendor name</label><input name="name" required value="${esc(v.name||'')}"></div><div class="field"><label>Service types</label><input name="service_types" value="${esc((v.service_types||[]).join(', '))}" placeholder="water, waste, fuel"></div><div class="field"><label>Primary contact</label><input name="primary_contact" value="${esc(v.primary_contact||'')}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(v.phone||'')}"></div><div class="field"><label>Email</label><input name="email" value="${esc(v.email||'')}"></div><div class="field full"><label>Banking notes</label><textarea name="banking_notes">${esc(v.banking_notes||'')}</textarea></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(v.notes||'')}</textarea></div><div class="field"><label>Active</label><select name="active"><option value="true" ${v.active!==false?'selected':''}>Yes</option><option value="false" ${v.active===false?'selected':''}>No</option></select></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save vendor</button></div></form>`);$('vendorForm').onsubmit=e=>saveVendor(e,id)}
async function saveVendor(e,id){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());o.service_types=o.service_types.split(',').map(x=>x.trim()).filter(Boolean);o.active=o.active==='true';try{const {error}=id?await sb.from('vendors').update(o).eq('id',id):await sb.from('vendors').insert(o);if(error)throw error;await loadAll();closeModal();render();toast('Vendor saved')}catch(err){toast(err.message)}}
function openServiceForm(id=null,callId=''){const s=id?cache.services.find(x=>x.id===id):{};modal(id?'Edit Service Request':'New Service Request',`<form id="serviceForm"><div class="form-grid"><div class="field"><label>Port call</label><select name="port_call_id">${callOptions(s.port_call_id||callId)}</select></div><div class="field"><label>Vendor</label><select name="vendor_id"><option value="">Vendor TBC</option>${cache.vendors.map(v=>`<option value="${v.id}" ${s.vendor_id===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div class="field"><label>Service type</label><input name="service_type" required value="${esc(s.service_type||'Water')}"></div><div class="field"><label>Status</label><select name="status">${['requested','confirmed','in_progress','completed','cancelled'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Scheduled</label><input name="scheduled_at" type="datetime-local" value="${dtLocal(s.scheduled_at)}"></div><div class="field"><label>Quoted amount</label><input name="quoted_amount" type="number" step="0.01" value="${s.quoted_amount??''}"></div><div class="field"><label>Currency</label><input name="currency" value="${esc(s.currency||'XCD')}"></div><div class="field"><label>Invoice reference</label><input name="invoice_reference" value="${esc(s.invoice_reference||'')}"></div><div class="field full"><label>Description</label><textarea name="description">${esc(s.description||'')}</textarea></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(s.notes||'')}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save service</button></div></form>`);$('serviceForm').onsubmit=e=>saveService(e,id)}
async function saveService(e,id){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());o.scheduled_at=o.scheduled_at?new Date(o.scheduled_at).toISOString():null;o.quoted_amount=o.quoted_amount?+o.quoted_amount:null;if(o.status==='completed')o.completed_at=new Date().toISOString();try{const {error}=id?await sb.from('service_requests').update(o).eq('id',id):await sb.from('service_requests').insert({...o,created_by:session.user.id});if(error)throw error;await loadAll();closeModal();render();toast('Service saved')}catch(err){toast(err.message)}}
function openDocumentForm(id=null,callId=''){const d=id?cache.documents.find(x=>x.id===id):{};modal(id?'Edit Document':'Upload Document',`<form id="docForm" enctype="multipart/form-data"><div class="form-grid"><div class="field"><label>Port call</label><select name="port_call_id">${callOptions(d.port_call_id||callId)}</select></div><div class="field"><label>Document type</label><input name="document_type" value="${esc(d.document_type||'Arrival package')}"></div><div class="field full"><label>File</label><input name="file" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.jpg,.jpeg,.png,.txt" ${id?'':'required'}></div></div><div class="notice">Maximum recommended file size is 10 MB per upload. Files remain private.</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${id?'Save changes':'Upload file'}</button></div></form>`);$('docForm').onsubmit=e=>saveDocument(e,id)}
async function saveDocument(e,id){e.preventDefault();const f=new FormData(e.target),callId=f.get('port_call_id')||'unlinked',type=f.get('document_type')||'Document';try{if(id){const {error}=await sb.from('documents').update({port_call_id:f.get('port_call_id'),document_type:type}).eq('id',id);if(error)throw error}else{const file=f.get('file');if(!(file instanceof File)||!file.size)throw new Error('Please select a file.');if(file.size>10*1024*1024)throw new Error('File is larger than 10 MB.');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${callId}/${Date.now()}-${safe}`;const up=await sb.storage.from('cruiseops-documents').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(up.error)throw up.error;const {error}=await sb.from('documents').insert({port_call_id:f.get('port_call_id')||null,file_name:file.name,storage_path:path,document_type:type,uploaded_by:session.user.id});if(error){await sb.storage.from('cruiseops-documents').remove([path]);throw error}}await loadAll();closeModal();render();toast(id?'Document updated':'Document uploaded')}catch(err){toast(err.message)}}
async function openDocument(id){const d=cache.documents.find(x=>x.id===id);if(!d?.storage_path)return toast('Document path is missing.');const {data,error}=await sb.storage.from('cruiseops-documents').createSignedUrl(d.storage_path,300);if(error)toast(error.message);else if(data?.signedUrl)window.open(data.signedUrl,'_blank','noopener,noreferrer')}
function openPersonForm(id=null,shipId=''){const c=id?cache.contacts.find(x=>x.id===id):{};modal(id?'Edit Person':'New Person',`<form id="personForm"><div class="form-grid"><div class="field"><label>Type</label><select name="type">${['crew','passenger','staff','vendor_contact'].map(x=>`<option ${c.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Ship</label><select name="ship_id"><option value="">No ship</option>${shipOptions(c.ship_id||shipId)}</select></div><div class="field"><label>First name</label><input name="first_name" value="${esc(c.first_name||'')}"></div><div class="field"><label>Last name</label><input name="last_name" value="${esc(c.last_name||'')}"></div><div class="field"><label>External ID</label><input name="external_id" value="${esc(c.external_id||'')}"></div><div class="field"><label>Nationality</label><input name="nationality" value="${esc(c.nationality||'')}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(c.phone||'')}"></div><div class="field"><label>Email</label><input name="email" value="${esc(c.email||'')}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(c.notes||'')}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save person</button></div></form>`);$('personForm').onsubmit=e=>savePerson(e,id)}
async function savePerson(e,id){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());try{const {error}=id?await sb.from('contacts').update(o).eq('id',id):await sb.from('contacts').insert(o);if(error)throw error;await loadAll();closeModal();render();toast('Person saved')}catch(err){toast(err.message)}}
function openProfileForm(){modal('Edit profile',`<form id="profileForm"><div class="field"><label>Full name</label><input name="full_name" required value="${esc(profile.full_name||'')}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(profile.phone||'')}"></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);$('profileForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());const {error}=await sb.from('profiles').update(o).eq('id',session.user.id);if(error)return toast(error.message);profile={...profile,...o};$('userChip').textContent=profile.full_name;closeModal();render();toast('Profile updated')}}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
init();
</script>
